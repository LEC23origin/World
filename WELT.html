  <style>
    :root {
      --ink: #eee8dc;
      --muted: #a39c8e;
      --dim: #6a6458;
      --glass: rgba(8, 9, 12, 0.68);
      --line: rgba(238, 232, 220, 0.12);
      --gold: #d7b57a;
      --accent: #8fd0c8;
      --accent-rgb: 143, 208, 200;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050507; color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
    #c { position: fixed; inset: 0; display: block; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 6;
      background:
        radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,calc(var(--vignette, .42))) 100%),
        linear-gradient(180deg, rgba(0,0,0,.18), transparent 18%, transparent 78%, rgba(0,0,0,.28));
    }
    .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .hud > * { pointer-events: auto; }

    .topbar {
      position: absolute; top: 18px; left: 20px; right: 20px;
      display: flex; align-items: center; gap: 16px;
    }
    .brand {
      font-family: "Instrument Serif", serif;
      font-size: 26px; letter-spacing: 0.2em;
      user-select: none; line-height: 1;
      display: flex; align-items: center; gap: 10px;
    }
    .brand img {
      width: 42px; height: 42px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--line);
      box-shadow: 0 0 18px rgba(215,181,122,.18);
    }
    .brand small {
      display: block; margin-top: 4px;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 10px; letter-spacing: 0.28em; color: var(--gold);
    }
    .langsel {
      height: 36px; padding: 0 10px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--glass);
      color: var(--ink); font-size: 12px; cursor: pointer;
      backdrop-filter: blur(16px); max-width: 132px;
    }
    html[dir="rtl"] .panel { left: auto; right: 20px; transform: translateX(120%); }
    html[dir="rtl"] .panel.open { transform: none; }
    html[dir="rtl"] .look { right: auto; left: 20px; }
    html[dir="rtl"] .legend { right: auto; left: 20px; text-align: left; }
    .searchwrap { flex: 1; max-width: 420px; position: relative; }
    .searchwrap input {
      width: 100%; height: 42px;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0 16px;
      border-radius: 999px;
      outline: none;
      font-size: 14px;
      backdrop-filter: blur(16px);
    }
    .searchwrap input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .suggest {
      position: absolute; top: 48px; left: 0; right: 0;
      background: rgba(8,8,12,.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      display: none;
      overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .suggest.open { display: block; }
    .suggest div { padding: 9px 14px; cursor: pointer; font-size: 13px; color: var(--muted); }
    .suggest div:hover { background: rgba(255,255,255,.05); color: var(--ink); }
    .tools { display: flex; gap: 8px; margin-left: auto; }
    .tools button {
      height: 36px; padding: 0 13px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--glass);
      color: var(--ink); font-size: 12px; letter-spacing: .06em; cursor: pointer;
      backdrop-filter: blur(16px);
    }

    .rooms {
      position: absolute; left: 20px; right: 20px; top: 78px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .rooms button {
      border: 1px solid var(--line);
      background: rgba(8,9,12,.55);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }
    .rooms button.active, .rooms button:hover {
      color: var(--ink);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .panel {
      position: absolute; left: 20px; top: 128px; bottom: 24px;
      width: min(400px, calc(100vw - 40px));
      background: linear-gradient(180deg, rgba(7,8,12,.82), rgba(7,8,12,.52));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px 20px 24px;
      overflow: auto;
      backdrop-filter: blur(22px);
      transform: translateX(-120%);
      opacity: 0;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s;
    }
    .panel.open { transform: none; opacity: 1; }
    .kicker {
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
    }
    .panel h1 {
      font-family: "Instrument Serif", serif;
      font-size: 34px; font-weight: 400; line-height: 1.05; margin-bottom: 10px;
    }
    .idea {
      font-size: 15px; line-height: 1.55; color: #d9d2c4; margin-bottom: 16px;
    }
    .panel img.hero {
      width: 100%; height: 160px; object-fit: cover; border-radius: 14px; margin: 4px 0 16px; background: #111;
    }
    h3.sec {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 16px 0 8px;
    }
    .chapters { display: flex; flex-direction: column; gap: 6px; }
    .chapters button {
      text-align: left; background: rgba(255,255,255,.03);
      border: 1px solid var(--line); color: var(--ink);
      padding: 9px 11px; border-radius: 12px; cursor: pointer; font-size: 13px;
    }
    .chapters button em {
      display: block; font-style: normal; font-size: 10px; letter-spacing: .12em; color: var(--gold); margin-bottom: 2px;
    }
    .stations { display: flex; flex-wrap: wrap; gap: 7px; }
    .stations button {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
      color: var(--accent);
      padding: 7px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
    }
    .note { margin-top: 16px; font-size: 13px; line-height: 1.55; color: var(--muted); }
    a.wiki { display: inline-block; margin-top: 14px; color: var(--dim); font-size: 12px; }

    .legend {
      position: absolute; right: 20px; bottom: 22px;
      font-size: 12px; color: var(--dim); text-align: right; max-width: 260px; line-height: 1.5;
    }
    .toast {
      position: absolute; top: 124px; left: 50%; transform: translateX(-50%);
      background: var(--glass); border: 1px solid var(--line);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--muted);
      opacity: 0; transition: .3s; backdrop-filter: blur(12px); pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .boot {
      position: fixed; inset: 0; z-index: 40; background: #050507;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .8s ease;
    }
    .boot.hide { opacity: 0; pointer-events: none; }
    .boot h2 { font-family: "Instrument Serif", serif; font-size: clamp(40px, 8vw, 84px); letter-spacing: .2em; font-weight: 400; }
    .boot p { margin-top: 12px; color: var(--muted); letter-spacing: .3em; font-size: 11px; text-transform: uppercase; }

    .look {
      position: absolute; right: 20px; top: 128px;
      width: 248px;
      background: linear-gradient(180deg, rgba(8,9,12,.86), rgba(8,9,12,.58));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 16px 14px;
      backdrop-filter: blur(22px);
    }
    .look h2 {
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold); font-weight: 500; margin-bottom: 12px;
    }
    .swatches { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .swatches button {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      cursor: pointer; padding: 0;
      box-shadow: 0 0 0 3px transparent;
    }
    .swatches button.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
    .row { margin-bottom: 12px; }
    .row label {
      display: flex; justify-content: space-between;
      font-size: 11px; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px;
    }
    .row label b { color: var(--ink); font-weight: 500; }
    input[type="range"] {
      width: 100%; accent-color: var(--accent); height: 4px;
    }
    .tint {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .tint input[type="color"] {
      width: 34px; height: 28px; border: 1px solid var(--line);
      background: transparent; border-radius: 8px; cursor: pointer; padding: 0;
    }
    .tint span { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 14px; }
    .modes button {
      height: 34px; border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--ink); cursor: pointer;
      font-size: 11px; letter-spacing: .12em;
    }
    .modes button.on {
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .look .ghost {
      width: 100%; height: 32px; margin-top: 4px;
      border-radius: 999px; border: 1px solid var(--line);
      background: transparent; color: var(--ink); cursor: pointer; font-size: 11px; letter-spacing: .1em;
    }
    body.studio .panel { background: linear-gradient(180deg, rgba(16,16,18,.88), rgba(14,14,16,.7)); }
    body.theater .panel { background: linear-gradient(180deg, rgba(4,4,6,.72), rgba(4,4,6,.4)); }
    body.theater .rooms button { opacity: .55; }
    body.theater .brand { opacity: .78; }

    @media (max-width: 740px) {
      .legend { display: none; }
      .look { display: none; }
      .look.open {
        display: block; left: 12px; right: 12px; width: auto; top: auto; bottom: 12px;
        z-index: 20;
      }
      .panel { width: calc(100vw - 24px); left: 12px; top: auto; bottom: 12px; max-height: 46vh; }
      .rooms { top: 70px; }
    }
  </style>
</head>

    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const ROOMS = [
      { id: "kosmos", label: "Kosmos", title: "Sonnensystem", hue: 0.12 },
      { id: "materie", label: "Materie", title: "Atom", hue: 0.55 },
      { id: "leben", label: "Leben", title: "Desoxyribonukleinsäure", hue: 0.33 },
      { id: "erde", label: "Erde", title: "Erde", hue: 0.48 },
      { id: "mensch", label: "Mensch", title: "Mensch", hue: 0.05 },
      { id: "denken", label: "Denken", title: "Mathematik", hue: 0.78 },
      { id: "geschichte", label: "Geschichte", title: "Geschichte", hue: 0.08 },
      { id: "technik", label: "Technik", title: "Technik", hue: 0.58 }
    ];

    const KEYWORDS = {
      kosmos: ["sonne", "planet", "stern", "galaxie", "mond", "universum", "kosmos", "astronom", "orbit", " milchstraße", "schwarzes loch"],
      materie: ["atom", "element", "molekül", "chemie", "teilchen", "quant", "kern", "elektron", "physik"],
      leben: ["dna", "desoxy", "zelle", "biolog", "evolu", "gen", "organismus", "pflanze", "tier"],
      erde: ["erde", "klima", "ozean", "kontinent", "geolog", "wetter", "atmosphäre", "karte"],
      mensch: ["mensch", "körper", "gehirn", "medizin", "anatom", "gesellschaft"],
      denken: ["mathematik", "philosophie", "logik", "zahl", "beweis", "geometr", "denken"],
      geschichte: ["geschichte", "krieg", "reich", "antike", "mittelalter", "revolution", "jahrhundert"],
      technik: ["technik", "maschine", "computer", "motor", "ingenieur", "strom", "internet"]
    };

    const panel = document.getElementById("panel");
    const suggestEl = document.getElementById("suggest");
    const qEl = document.getElementById("q");
    const toastEl = document.getElementById("toast");
    const roomsEl = document.getElementById("rooms");
    const langSel = document.getElementById("langSel");
    const I18 = window.WELT_I18N;
    const ROOM_IDS = ["kosmos","materie","leben","erde","mensch","denken","geschichte","technik"];
    const supported = I18.langs.map(x => x.id);
    const guess = (localStorage.getItem("welt.lang") || (navigator.language || "de").slice(0, 2)).toLowerCase();
    let lang = supported.includes(guess) ? guess : "de";
    const host = () => `${lang}.wikipedia.org`;
    langSel.innerHTML = I18.langs.map(x => `<option value="${x.id}">${x.name}</option>`).join("");

    function ui() {
      return I18.ui[lang] || I18.ui.en;
    }
    function roomPair(id) {
      return (I18.rooms[id] && (I18.rooms[id][lang] || I18.rooms[id].en)) || [id, id];
    }
    function paintRooms() {
      roomsEl.innerHTML = ROOM_IDS.map(id => {
        const [label, title] = roomPair(id);
        return `<button data-room="${id}" data-title="${title}">${label}</button>`;
      }).join("");
      [...roomsEl.querySelectorAll("button")].forEach(b => b.classList.toggle("active", b.dataset.room === activeRoom));
    }
    function applyUI() {
      const u = ui();
      const meta = I18.langs.find(x => x.id === lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = meta?.dir || "ltr";
      document.title = u.doc;
      document.getElementById("tagline").textContent = u.tagline;
      qEl.placeholder = u.search;
      document.getElementById("lookToggle").textContent = u.light;
      document.getElementById("rand").textContent = u.other;
      document.getElementById("moodTitle").textContent = u.mood;
      document.getElementById("modeStudio").textContent = u.studio;
      document.getElementById("modeTheater").textContent = u.theater;
      document.getElementById("tintLabel").textContent = u.tint;
      document.getElementById("labBright").textContent = u.bright;
      document.getElementById("labSat").textContent = u.sat;
      document.getElementById("labBloom").textContent = u.bloom;
      document.getElementById("labFog").textContent = u.fog;
      document.getElementById("followRoom").textContent = look.followRoom ? u.followOn : u.followOff;
      document.getElementById("legend").innerHTML = u.legend.replace("\n", "<br/>");
      document.getElementById("bootLine").textContent = u.boot;
      langSel.value = lang;
      paintRooms();
    }

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.10;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050507);
    scene.fog = new THREE.FogExp2(0x050507, 0.016);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(0, 3.2, 16);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.048;
    controls.minDistance = 5;
    controls.maxDistance = 42;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.18;

    const ambient = new THREE.AmbientLight(0x9aa8b8, 0.38);
    scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0xc9d6e4, 0x1a1410, 0.35);
    scene.add(hemi);
    const key = new THREE.PointLight(0xe8f2f0, 46, 90); key.position.set(7, 9, 10); scene.add(key);
    const fill = new THREE.PointLight(0xd7b57a, 16, 70); fill.position.set(-9, -3, -5); scene.add(fill);
    const spot = new THREE.SpotLight(0xfff1d6, 0, 48, Math.PI / 6.2, 0.45, 1.1);
    spot.position.set(2.5, 11, 9);
    spot.target.position.set(0, 0, 0);
    scene.add(spot, spot.target);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.7, 0.22);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    function starField(n, spread, size, color) {
      const g = new THREE.BufferGeometry();
      const p = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        p[i*3] = (Math.random()-.5)*spread;
        p[i*3+1] = (Math.random()-.5)*spread;
        p[i*3+2] = (Math.random()-.5)*spread;
      }
      g.setAttribute("position", new THREE.BufferAttribute(p, 3));
      return new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent: true, opacity: .85, sizeAttenuation: true }));
    }
    const starsFar = starField(2400, 170, 0.055, 0xb9c4d2);
    const starsNear = starField(700, 80, 0.11, 0xeee8dc);
    scene.add(starsFar, starsNear);

    const world = new THREE.Group();
    scene.add(world);
    const pickables = [];
    let currentTitle = null;
    let activeRoom = "kosmos";

    const PRESETS = [
      { id: "gold", hex: "#d7b57a", name: "Gold" },
      { id: "polar", hex: "#9ec4d6", name: "Polar" },
      { id: "smaragd", hex: "#7dcaa8", name: "Smaragd" },
      { id: "amethyst", hex: "#b7a0e0", name: "Amethyst" },
      { id: "rose", hex: "#e0a08a", name: "Rose" },
      { id: "nacht", hex: "#6f86c9", name: "Nacht" },
      { id: "elfenbein", hex: "#eee4c8", name: "Elfenbein" }
    ];

    const look = {
      hex: localStorage.getItem("welt.hex") || "#d7b57a",
      brightness: Number(localStorage.getItem("welt.bright") || 1.10),
      sat: Number(localStorage.getItem("welt.sat") || 32),
      bloom: Number(localStorage.getItem("welt.bloom") || 0.55),
      fog: Number(localStorage.getItem("welt.fog") || 0.016),
      followRoom: localStorage.getItem("welt.follow") !== "0",
      mode: localStorage.getItem("welt.mode") || "custom"
    };

    const swatchBox = document.getElementById("swatches");
    swatchBox.innerHTML = PRESETS.map(p =>
      `<button type="button" data-hex="${p.hex}" title="${p.name}" style="background:${p.hex}"></button>`
    ).join("");

    function hexToRgb(hex) {
      const n = hex.replace("#", "");
      const v = parseInt(n.length === 3 ? n.split("").map(c => c+c).join("") : n, 16);
      return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
    }
    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");
    }
    function mixHex(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return rgbToHex(
        Math.round(A.r + (B.r - A.r) * t),
        Math.round(A.g + (B.g - A.g) * t),
        Math.round(A.b + (B.b - A.b) * t)
      );
    }

    function applyLook() {
      const { r, g, b } = hexToRgb(look.hex);
      const accent = look.hex;
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--gold", mixHex(accent, "#d7b57a", 0.35));
      document.documentElement.style.setProperty("--accent-rgb", `${r},${g},${b}`);
      document.documentElement.style.setProperty("--vignette", String(0.28 + (1.4 - look.brightness) * 0.18));

      renderer.toneMappingExposure = look.brightness;
      bloomPass.strength = look.bloom;
      scene.fog.density = look.fog;

      const col = new THREE.Color(look.hex);
      const sat = look.sat / 100;
      const hsl = { h: 0, s: 0, l: 0 };
      col.getHSL(hsl);
      const keyCol = new THREE.Color().setHSL(hsl.h, Math.min(1, hsl.s * 0.6 + sat * 0.5), 0.72);
      const fillCol = new THREE.Color().setHSL((hsl.h + 0.08) % 1, Math.min(1, sat + 0.15), 0.58);
      const ambCol = new THREE.Color().setHSL(hsl.h, sat * 0.25, 0.68);
      key.color.copy(keyCol);
      fill.color.copy(fillCol);
      ambient.color.copy(ambCol);
      hemi.color.copy(keyCol);
      hemi.groundColor.setHSL(hsl.h, sat * 0.3, 0.08);
      starsNear.material.color.setHSL(hsl.h, sat * 0.2, 0.92);
      starsFar.material.color.setHSL(hsl.h, sat * 0.15, 0.78);

      const bg = new THREE.Color().setHSL(hsl.h, sat * 0.22, 0.035 * Math.min(1.15, look.brightness));
      if (look.followRoom === false) {
        scene.background.copy(bg);
        scene.fog.color.copy(bg);
      }

      key.intensity = 28 + look.brightness * 22;
      fill.intensity = 8 + look.brightness * 10;
      ambient.intensity = 0.22 + look.brightness * 0.18;
      hemi.intensity = 0.28 + look.brightness * 0.12;
      spot.intensity = 0;
      bloomPass.threshold = 0.22;
      bloomPass.radius = 0.7;
      controls.autoRotateSpeed = 0.18;
      starsFar.material.opacity = 0.85;
      starsNear.material.opacity = 0.9;

      if (look.mode === "studio") {
        key.intensity = 62;
        fill.intensity = 24;
        ambient.intensity = 0.72;
        hemi.intensity = 0.62;
        spot.intensity = 8;
        bloomPass.threshold = 0.42;
        bloomPass.radius = 0.35;
        controls.autoRotateSpeed = 0.08;
        starsFar.material.opacity = 0.35;
        starsNear.material.opacity = 0.45;
      }
      if (look.mode === "theater") {
        key.intensity = 10;
        fill.intensity = 3;
        ambient.intensity = 0.08;
        hemi.intensity = 0.1;
        spot.intensity = 48;
        bloomPass.threshold = 0.12;
        bloomPass.radius = 0.95;
        controls.autoRotateSpeed = 0.12;
        starsFar.material.opacity = 0.55;
        starsNear.material.opacity = 0.7;
        const dark = new THREE.Color(0x030308);
        scene.background.copy(dark);
        scene.fog.color.copy(dark);
      }

      document.body.classList.toggle("studio", look.mode === "studio");
      document.body.classList.toggle("theater", look.mode === "theater");
      document.getElementById("modeStudio").classList.toggle("on", look.mode === "studio");
      document.getElementById("modeTheater").classList.toggle("on", look.mode === "theater");
      localStorage.setItem("welt.mode", look.mode);
      applyStage();

      document.getElementById("tint").value = look.hex;
      document.getElementById("bright").value = look.brightness;
      document.getElementById("sat").value = look.sat;
      document.getElementById("bloom").value = look.bloom;
      document.getElementById("fog").value = look.fog;
      document.getElementById("vBright").textContent = look.brightness.toFixed(2);
      document.getElementById("vSat").textContent = String(look.sat);
      document.getElementById("vBloom").textContent = look.bloom.toFixed(2);
      document.getElementById("vFog").textContent = look.fog.toFixed(3);
      document.getElementById("followRoom").textContent = look.followRoom ? ui().followOn : ui().followOff;
      [...swatchBox.querySelectorAll("button")].forEach(btn => {
        btn.classList.toggle("on", btn.dataset.hex.toLowerCase() === look.hex.toLowerCase());
      });

      localStorage.setItem("welt.hex", look.hex);
      localStorage.setItem("welt.bright", String(look.brightness));
      localStorage.setItem("welt.sat", String(look.sat));
      localStorage.setItem("welt.bloom", String(look.bloom));
      localStorage.setItem("welt.fog", String(look.fog));
      localStorage.setItem("welt.follow", look.followRoom ? "1" : "0");
    }

    function roleOf(obj) {
      let x = obj;
      while (x) {
        if (x.userData?.role) return x.userData.role;
        x = x.parent;
      }
      return "";
    }

    function applyStage() {
      world.traverse(o => {
        const role = roleOf(o);
        if (!o.material) return;
        if (look.mode === "theater") {
          if (role === "station" || role === "plate") {
            if (typeof o.material.opacity === "number") o.material.opacity = role === "plate" ? 0.16 : 0.2;
            if (o.material.emissiveIntensity != null) o.material.emissiveIntensity = 0.05;
          } else if (role === "exhibit") {
            if (o.material.emissiveIntensity != null) {
              o.material.emissiveIntensity = Math.max(o.userData.baseEmit ?? o.material.emissiveIntensity, 0.7);
            }
          }
        } else {
          if (role === "plate" && typeof o.material.opacity === "number") o.material.opacity = 0.92;
          if (role === "station" && o.material.emissiveIntensity != null) o.material.emissiveIntensity = 0.25;
        }
      });
    }

    function toast(m) {
      toastEl.textContent = m;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function clearWorld() {
      world.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (o.material.map) o.material.map.dispose();
          o.material.dispose?.();
        }
      });
      while (world.children.length) world.remove(world.children[0]);
      pickables.length = 0;
    }

    function classify(title, extract, sections) {
      const blob = `${title} ${extract} ${(sections||[]).join(" ")}`.toLowerCase();
      let best = "denken", score = 0;
      for (const [id, words] of Object.entries(KEYWORDS)) {
        const s = words.reduce((n, w) => n + (blob.includes(w) ? 1 : 0), 0);
        if (s > score) { score = s; best = id; }
      }
      return best;
    }

    function setAtmosphere(roomId) {
      const map = {
        kosmos: ["#05060c", "#d7b57a"],
        materie: ["#07070c", "#8fd0c8"],
        leben: ["#050a07", "#7dcaa8"],
        erde: ["#05080c", "#6aa8d8"],
        mensch: ["#0a0706", "#e0a08a"],
        denken: ["#07050c", "#b7a0e0"],
        geschichte: ["#0a0805", "#d7b57a"],
        technik: ["#05070a", "#9ec4d6"]
      };
      const [bg, accent] = map[roomId] || map.denken;
      scene.background.set(bg);
      scene.fog.color.set(bg);
      if (look.followRoom) look.hex = accent;
      applyLook();
    }

    function addPick(mesh, title) {
      mesh.userData.title = title;
      pickables.push(mesh);
    }

    function labelSprite(text, scale = 2.6) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 96;
      const ctx = c.getContext("2d");
      ctx.font = "500 30px IBM Plex Sans, sans-serif";
      ctx.fillStyle = "rgba(238,232,220,.92)";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const t = text.length > 26 ? text.slice(0, 25) + "…" : text;
      ctx.fillText(t, 256, 48);
      const tex = new THREE.CanvasTexture(c);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      s.scale.set(scale, scale * 0.19, 1);
      return s;
    }

    function exhibitSolar() {
      const g = new THREE.Group();
      const sun = new THREE.Mesh(
        new THREE.SphereGeometry(1.15, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xffc14a, emissive: 0xff9a1a, emissiveIntensity: 1.4, roughness: 0.4 })
      );
      g.add(sun);
      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(1.7, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.08 })
      );
      g.add(halo);
      const planets = [
        ["Merkur", 0xb0b0b0, 0.12, 2.2, 1.6],
        ["Venus", 0xd4b483, 0.16, 2.9, 1.2],
        ["Erde", 0x4f8fbf, 0.18, 3.7, 0.9],
        ["Mars", 0xc45b32, 0.14, 4.5, 0.72],
        ["Jupiter", 0xd9b07a, 0.38, 5.8, 0.42],
        ["Saturn", 0xe6d3a3, 0.32, 7.0, 0.33],
        ["Uranus", 0x8fd0c8, 0.22, 8.1, 0.24],
        ["Neptun", 0x4d73d9, 0.21, 9.1, 0.18]
      ];
      planets.forEach(([name, col, r, dist, speed], i) => {
        const orbit = new THREE.Group();
        orbit.userData = { spin: speed, kind: "orbit" };
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(r, 18, 18),
          new THREE.MeshStandardMaterial({ color: col, roughness: 0.45, metalness: 0.15 })
        );
        p.position.x = dist;
        addPick(p, name);
        const lab = labelSprite(name, 1.8);
        lab.position.set(dist, r + 0.28, 0);
        orbit.add(p, lab);
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(dist, 0.008, 8, 80),
          new THREE.MeshBasicMaterial({ color: 0xd7b57a, transparent: true, opacity: 0.18 })
        );
        ring.rotation.x = Math.PI / 2;
        g.add(ring, orbit);
        if (name === "Saturn") {
          const sr = new THREE.Mesh(
            new THREE.TorusGeometry(r * 1.8, 0.04, 8, 40),
            new THREE.MeshStandardMaterial({ color: 0xe6d3a3, transparent: true, opacity: 0.7 })
          );
          sr.rotation.x = Math.PI / 2.4;
          p.add(sr);
        }
      });
      return g;
    }

    function exhibitAtom() {
      const g = new THREE.Group();
      const nuc = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xff6a4a, emissive: 0x802010, roughness: 0.3 })
      );
      g.add(nuc);
      [1.6, 2.5, 3.5].forEach((rad, i) => {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(rad, 0.012, 8, 80),
          new THREE.MeshBasicMaterial({ color: 0x8fd0c8, transparent: true, opacity: 0.28 })
        );
        ring.rotation.x = Math.PI / 2 + i * 0.4;
        ring.rotation.y = i * 0.5;
        ring.userData = { spin: 0.3 + i * 0.15, kind: "tilt" };
        g.add(ring);
        const e = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 12, 12),
          new THREE.MeshStandardMaterial({ color: 0x8fd0c8, emissive: 0x245e55, emissiveIntensity: 0.8 })
        );
        e.position.x = rad;
        const hold = new THREE.Group();
        hold.rotation.copy(ring.rotation);
        hold.userData = { spin: 0.8 + i * 0.4, kind: "orbit" };
        hold.add(e);
        g.add(hold);
      });
      const lab = labelSprite("Kern + Schalen", 3.2);
      lab.position.y = -4.2;
      g.add(lab);
      return g;
    }

    function exhibitDNA() {
      const g = new THREE.Group();
      const n = 28;
      for (let i = 0; i < n; i++) {
        const t = i / n * Math.PI * 6;
        const y = (i - n / 2) * 0.22;
        const a = new THREE.Mesh(
          new THREE.SphereGeometry(0.11, 10, 10),
          new THREE.MeshStandardMaterial({ color: i % 2 ? 0x8fd0c8 : 0x6aa8d8 })
        );
        const b = a.clone();
        b.material = new THREE.MeshStandardMaterial({ color: i % 2 ? 0xd7b57a : 0xe07a6a });
        a.position.set(Math.cos(t) * 0.9, y, Math.sin(t) * 0.9);
        b.position.set(Math.cos(t + Math.PI) * 0.9, y, Math.sin(t + Math.PI) * 0.9);
        g.add(a, b);
        if (i % 2 === 0) {
          const geo = new THREE.BufferGeometry().setFromPoints([a.position, b.position]);
          g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xeee8dc, transparent: true, opacity: 0.35 })));
        }
      }
      g.userData = { spin: 0.25, kind: "orbit" };
      return g;
    }

    function exhibitEarth() {
      const g = new THREE.Group();
      const globe = new THREE.Mesh(
        new THREE.SphereGeometry(2.1, 48, 48),
        new THREE.MeshStandardMaterial({ color: 0x2a6cad, roughness: 0.55, metalness: 0.1, emissive: 0x0a2030, emissiveIntensity: 0.25 })
      );
      const land = new THREE.Mesh(
        new THREE.IcosahedronGeometry(2.13, 3),
        new THREE.MeshStandardMaterial({ color: 0x3d8a5a, flatShading: true, transparent: true, opacity: 0.55 })
      );
      const atm = new THREE.Mesh(
        new THREE.SphereGeometry(2.35, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x8ec8ff, transparent: true, opacity: 0.07 })
      );
      globe.userData = { spin: 0.15, kind: "orbit" };
      g.add(globe, land, atm);
      addPick(globe, "Erde");
      return g;
    }

    function exhibitDefault(title, roomId) {
      const g = new THREE.Group();
      const hue = { kosmos: 0.12, materie: 0.5, leben: 0.33, erde: 0.55, mensch: 0.05, denken: 0.75, geschichte: 0.09, technik: 0.52 }[roomId] || 0.5;
      const col = new THREE.Color().setHSL(hue, 0.45, 0.55);
      const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.35, 1),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.28, metalness: 0.35, emissive: col, emissiveIntensity: 0.18 })
      );
      const wire = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.55, 1),
        new THREE.MeshBasicMaterial({ color: 0xeee8dc, wireframe: true, transparent: true, opacity: 0.16 })
      );
      wire.userData = { spin: -0.12, kind: "orbit" };
      g.add(core, wire);
      return g;
    }

    function pickExhibit(title, roomId) {
      const t = title.toLowerCase();
      if (roomId === "kosmos" || /sonnensystem|planet|merkur|venus|jupiter|saturn/.test(t)) return exhibitSolar();
      if (roomId === "materie" || /^atom$|chemisches element/.test(t)) return exhibitAtom();
      if (roomId === "leben" || /desoxy|dna|genetik/.test(t)) return exhibitDNA();
      if (roomId === "erde" || t === "erde" || t === "earth") return exhibitEarth();
      return exhibitDefault(title, roomId);
    }

    function placeStations(related) {
      const g = new THREE.Group();
      const n = Math.min(related.length, 10);
      related.slice(0, n).forEach((item, i) => {
        const a = (i / n) * Math.PI * 2;
        const rad = 11.2;
        const pos = new THREE.Vector3(Math.cos(a) * rad, Math.sin(i * 1.7) * 0.8, Math.sin(a) * rad);
        const hue = (i / n);
        const mesh = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.28, 0),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(hue, 0.4, 0.6),
            emissive: new THREE.Color().setHSL(hue, 0.4, 0.2),
            roughness: 0.35
          })
        );
        mesh.position.copy(pos);
        addPick(mesh, item.title);
        const lab = labelSprite(item.title, 3.1);
        lab.position.copy(pos).add(new THREE.Vector3(0, 0.55, 0));
        g.add(mesh, lab);
      });
      return g;
    }

    function placePlates(images) {
      const g = new THREE.Group();
      images.slice(0, 5).forEach((src, i) => {
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = "anonymous";
        loader.load(src, tex => {
          tex.colorSpace = THREE.SRGBColorSpace;
          const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.92, side: THREE.DoubleSide });
          const plane = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.7), mat);
          const a = (i / 5) * Math.PI * 2 + 0.4;
          plane.position.set(Math.cos(a) * 6.4, 2.2 + (i % 2) * 0.6, Math.sin(a) * 6.4);
          plane.lookAt(0, 2, 0);
          g.add(plane);
        }, undefined, () => {});
      });
      return g;
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("fail " + res.status);
      return res.json();
    }

    function absUrl(src) {
      if (!src) return null;
      if (src.startsWith("//")) return "https:" + src;
      return src;
    }

    async function searchWiki(term) {
      const url = `https://${host()}/w/api.php?action=opensearch&search=${encodeURIComponent(term)}&limit=7&namespace=0&format=json&origin=*`;
      const data = await fetchJSON(url);
      return (data[1] || []).map(title => ({ title }));
    }

    function firstSentences(text, n = 2) {
      const parts = (text || "").split(/(?<=[.!?])\s+/).filter(Boolean);
      return parts.slice(0, n).join(" ");
    }

    function cleanSections(secs) {
      const skip = /siehe auch|literatur|weblink|einzelnachweis|anmerkung|quelle|film|galerie|referenc|external|see also|notes/i;
      return (secs || []).filter(s => s.level === "2" && s.line && !skip.test(s.line)).slice(0, 6);
    }

    async function loadTopic(title, roomHint) {
      toast(ui().travel);
      let summary;
      try {
        summary = await fetchJSON(`https://${host()}/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, "_"))}`);
      } catch {
        toast(ui().missing);
        return;
      }

      let sections = [];
      try {
        const parsed = await fetchJSON(`https://${host()}/w/api.php?action=parse&page=${encodeURIComponent(summary.title)}&prop=sections&format=json&origin=*`);
        sections = cleanSections(parsed.parse?.sections || []);
      } catch {}

      let related = [];
      try {
        const rel = await fetchJSON(`https://${host()}/api/rest_v1/page/related/${encodeURIComponent(summary.title.replace(/ /g, "_"))}`);
        related = (rel.pages || []).map(p => ({ title: p.titles?.normalized || p.title }));
      } catch {}

      if (related.length < 5) {
        try {
          const links = await fetchJSON(`https://${host()}/w/api.php?action=query&prop=links&titles=${encodeURIComponent(summary.title)}&plnamespace=0&pllimit=16&format=json&origin=*`);
          const page = Object.values(links.query?.pages || {})[0];
          (page?.links || []).forEach(l => {
            if (!related.find(r => r.title === l.title)) related.push({ title: l.title });
          });
        } catch {}
      }

      const images = [];
      if (summary.thumbnail?.source) images.push(summary.thumbnail.source);
      try {
        const media = await fetchJSON(`https://${host()}/api/rest_v1/page/media-list/${encodeURIComponent(summary.title.replace(/ /g, "_"))}`);
        (media.items || []).forEach(it => {
          if (it.type !== "image" || !it.srcset?.length) return;
          const last = it.srcset[it.srcset.length - 1];
          const src = absUrl(last.src);
          if (src && !src.includes(".svg") && images.length < 6) images.push(src);
        });
      } catch {}

      const room = roomHint || classify(summary.title, summary.extract || "", sections.map(s => s.line));
      activeRoom = room;
      currentTitle = summary.title;
      setAtmosphere(room);
      [...roomsEl.querySelectorAll("button")].forEach(b => b.classList.toggle("active", b.dataset.room === room));

      clearWorld();
      const exhibit = pickExhibit(summary.title, room);
      exhibit.userData.role = "exhibit";
      const stations = placeStations(related);
      stations.userData.role = "station";
      const plates = placePlates(images);
      plates.userData.role = "plate";
      world.add(exhibit, stations, plates);
      applyStage();

      renderPanel(summary, sections, related, room);
      panel.classList.add("open");
    }

    function renderPanel(summary, sections, related, room) {
      const u = ui();
      const img = summary.thumbnail?.source;
      const idea = firstSentences(summary.extract || summary.description || "", 2);
      const [roomLabel] = roomPair(room);
      panel.innerHTML = `
        <div class="kicker">${esc(roomLabel).toUpperCase()} · ${esc(u.room)}</div>
        <h1>${esc(summary.title)}</h1>
        ${img ? `<img class="hero" alt="" src="${img}" />` : ""}
        <p class="idea">${esc(idea)}</p>
        <p class="note">${esc(u.blurb?.[room] || "")}</p>
        ${sections.length ? `
          <h3 class="sec">${esc(u.path)}</h3>
          <div class="chapters">
            ${sections.map((s, i) => `<button data-go="${attr(s.line)}"><em>${esc(u.station)} ${i+1}</em>${esc(s.line)}</button>`).join("")}
          </div>` : ""}
        <h3 class="sec">${esc(u.next)}</h3>
        <div class="stations">
          ${related.slice(0, 8).map(r => `<button data-go="${attr(r.title)}">${esc(r.title)}</button>`).join("")}
        </div>
        <a class="wiki" target="_blank" rel="noopener" href="${summary.content_urls?.desktop?.page || "#"}">${esc(u.source)}</a>
      `;
      panel.querySelectorAll("[data-go]").forEach(btn => {
        btn.addEventListener("click", () => loadTopic(btn.dataset.go));
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function attr(s) { return String(s ?? "").replace(/"/g, "&quot;"); }

    let tmr;
    qEl.addEventListener("input", () => {
      clearTimeout(tmr);
      const v = qEl.value.trim();
      if (v.length < 2) { suggestEl.classList.remove("open"); return; }
      tmr = setTimeout(async () => {
        try {
          const items = await searchWiki(v);
          suggestEl.innerHTML = items.map(i => `<div data-t="${attr(i.title)}">${esc(i.title)}</div>`).join("");
          suggestEl.classList.toggle("open", items.length > 0);
          suggestEl.querySelectorAll("div").forEach(d => d.onclick = () => {
            qEl.value = d.dataset.t;
            suggestEl.classList.remove("open");
            loadTopic(d.dataset.t);
          });
        } catch {}
      }, 160);
    });
    qEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && qEl.value.trim()) {
        suggestEl.classList.remove("open");
        loadTopic(qEl.value.trim());
      }
    });

    roomsEl.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      loadTopic(b.dataset.title, b.dataset.room);
    });

    document.getElementById("rand").onclick = async () => {
      const s = await fetchJSON(`https://${host()}/api/rest_v1/page/random/summary`);
      qEl.value = s.title;
      loadTopic(s.title);
    };
    async function titleInLang(title, from, to) {
      if (!title || from === to) return title;
      try {
        const data = await fetchJSON(`https://${from}.wikipedia.org/w/api.php?action=query&prop=langlinks&titles=${encodeURIComponent(title)}&lllang=${to}&lllimit=1&format=json&origin=*`);
        const page = Object.values(data.query?.pages || {})[0];
        const hit = page?.langlinks?.[0];
        return hit?.["*"] || title;
      } catch {
        return title;
      }
    }
    langSel.addEventListener("change", async () => {
      const next = langSel.value;
      const prev = lang;
      lang = next;
      localStorage.setItem("welt.lang", lang);
      applyUI();
      const mapped = currentTitle ? await titleInLang(currentTitle, prev, lang) : roomPair(activeRoom || "kosmos")[1];
      loadTopic(mapped, activeRoom);
    });

    swatchBox.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      look.followRoom = false;
      look.hex = b.dataset.hex;
      applyLook();
    });
    document.getElementById("tint").addEventListener("input", e => {
      look.followRoom = false;
      look.hex = e.target.value;
      applyLook();
    });
    document.getElementById("bright").addEventListener("input", e => {
      look.brightness = Number(e.target.value);
      applyLook();
    });
    document.getElementById("sat").addEventListener("input", e => {
      look.sat = Number(e.target.value);
      applyLook();
    });
    document.getElementById("bloom").addEventListener("input", e => {
      look.bloom = Number(e.target.value);
      applyLook();
    });
    document.getElementById("fog").addEventListener("input", e => {
      look.fog = Number(e.target.value);
      applyLook();
    });
    document.getElementById("followRoom").onclick = () => {
      look.followRoom = !look.followRoom;
      if (look.followRoom) setAtmosphere(activeRoom);
      else applyLook();
    };

    function setMode(mode) {
      if (look.mode === mode) {
        look.mode = "custom";
        applyLook();
        toast(mode === "studio" ? ui().studioOff : ui().theaterOff);
        return;
      }
      look.mode = mode;
      look.followRoom = false;
      if (mode === "studio") {
        look.hex = "#e6d7b8";
        look.brightness = 1.38;
        look.sat = 10;
        look.bloom = 0.16;
        look.fog = 0.007;
        toast(ui().studioOn);
      }
      if (mode === "theater") {
        look.hex = "#d7b57a";
        look.brightness = 0.68;
        look.sat = 38;
        look.bloom = 0.92;
        look.fog = 0.026;
        toast(ui().theaterOn);
      }
      applyLook();
    }
    document.getElementById("modeStudio").onclick = () => setMode("studio");
    document.getElementById("modeTheater").onclick = () => setMode("theater");
    document.getElementById("lookToggle").onclick = () => {
      document.getElementById("look").classList.toggle("open");
    };

    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener("pointermove", e => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    });
    renderer.domElement.addEventListener("click", () => {
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObjects(pickables, false)[0];
      if (hit?.object?.userData?.title) loadTopic(hit.object.userData.title);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function tick() {
      const dt = clock.getDelta();
      world.traverse(o => {
        if (o.userData?.kind === "orbit") o.rotation.y += (o.userData.spin || 0.2) * dt;
        if (o.userData?.kind === "tilt") {
          o.rotation.z += (o.userData.spin || 0.2) * dt;
        }
      });
      controls.update();
      composer.render();
      requestAnimationFrame(tick);
    }
    tick();

    applyLook();
    applyUI();
    setTimeout(() => {
      document.getElementById("boot").classList.add("hide");
      loadTopic(roomPair("kosmos")[1], "kosmos");
    }, 1200);
  </script>
</body>
</html>
